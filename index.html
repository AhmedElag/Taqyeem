egend-line prev"></i>${periodLabel(PREVIOUS)}</span></div></div></section>`;

          const groups=new Map();for(const s of currentStudents().filter(reviewDue)){const key=s.doctorId;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(s);}
          const notices=[...groups].map(([doctorId,students])=>({doctorId,count:students.length,id:'reminder-'+doctorId+'-'+DEMO_DATE}));
          modal(tr('Preview reminders','معاينة التذكيرات'),tr('One prompt per doctor. No private assessment content.','تنبيه واحد لكل طبيب دون محتوى التقييم الخاص.'),notices.map(n=>`<div class="h-outbox-row"><strong>${esc(facultyName(n.doctorId))}</strong><span>${n.count} ${tr('assessments due. Sign in to continue.','تقييمات مستحقة. ادخل للمتابعة.')}</span></div>`).join('')||`<p>${tr('No reminders needed today.','لا حاجة لتذكيرات اليوم.')}</p>`,button(tr('Close','إغلاق'),'close')+(notices.length?button(tr('Add to demo queue','إضافة إلى قائمة العرض'),'h-queue-reminders','bell','primary'):''));ui.hReminderPreview=notices;
        }
        else if(action==='h-queue-reminders'){for(const n of ui.hReminderPreview||[])if(!db.outbox.some(x=>x.id===n.id))db.outbox.push({id:n.id,recipientId:n.doctorId,kind:'due-reminder',status:'queued',attempts:0,createdAt:now()});save();closeModal();render();}
        else if(action==='h-process-queue'){for(const n of db.outbox.filter(n=>n.status!=='delivered')){n.status='delivered';n.attempts++;n.deliveredAt=now();}save();render();toast(tr('Demo queue processed once. No emails were sent.','عولجت القائمة مرة واحدة دون إرسال بريد.'));}
      }catch(err){toast(hError(err));}
    },true);
    document.addEventListener('input',event=>{if(event.target.id==='private-note')hScheduleDraft();if(event.target.id==='h-search'){ui.hSearch=event.target.value;hSearchResults(event.target.value);}});
    document.addEventListener('change',async event=>{
      const el=event.target;
      if(el.dataset.scoreIndex!=null)hScheduleDraft();
      if(el.id==='h-demo-admin'){hFlushBeforeLeave();ui.adminId=el.value;ui.page='overview';ui.evalDraft=null;ui.questionDraft=null;ui.program='all';ui.dashboardProgram='all';ui.reportProgram='all';ui.reportStudent='all';ui.hSearch='';render();}
      if(el.id==='h-demo-student'){ui.studentId=el.value;render();}
      if(el.id==='h-text-size'){ui.hText=el.value;localStorage.setItem('taqyeem-text',el.value);render();}
      if(el.id==='h-policy'&&ui.role==='admin'&&persona().scopeType==='hospital'){db.policy.peerReview=el.value;H.record(db,hActor(),'policy.changed','h1',now());save();render();}
      if(el.id==='h-training-program')document.getElementById('h-training-doctor').innerHTML=doctorOptions(el.value,'');
      if(el.id==='h-import-program')document.getElementById('h-import-doctor').innerHTML=doctorOptions(el.value,'');
      if(el.id==='h-import-file'&&el.files[0]){if(el.files[0].size>1024*1024){toast(tr('Choose a CSV smaller than 1 MB.','اختر CSV أصغر من ١ ميجابايت.'));return;}document.getElementById('h-import-text').value=await el.files[0].text();}
      if(el.id==='h-demo-date'&&/^\d{4}-\d{2}-\d{2}$/.test(el.value)){db.demoToday=el.value;DEMO_DATE=el.value;PERIOD=el.value.slice(0,7);PREVIOUS=H.addDays(PERIOD+'-01',-1).slice(0,7);ui.reportPeriod=PERIOD;save();render();}
      if(el.dataset.hCheck&&ui.role==='admin'){db.pilotChecks[el.dataset.hCheck]=el.checked;save();}
      if(el.id==='h-restore-file'&&el.files[0]){const node=document.getElementById('h-restore-preview');try{if(el.files[0].size>10*1024*1024)throw new Error(tr('Choose a backup smaller than 10 MB.','اختر نسخة أصغر من ١٠ ميجابايت.'));restoreCandidate=H.validateBackup(JSON.parse(await el.files[0].text()));node.innerHTML=`<div class="info-box"><span>${restoreCandidate.students.length} ${tr('residents','مقيمين')} · ${restoreCandidate.evaluations.length} ${tr('assessment versions','نسخ تقييمات')}<br>${tr('Your current demo will be downloaded first. Pending invitation links will be revoked.','ستُنزّل نسختك الحالية أولاً وتُلغى روابط الدعوات المعلقة.')}</span></div><div class="mt20">${button(tr('Confirm restoration','تأكيد الاستعادة'),'h-restore-confirm','refresh','primary')}</div>`;}catch(err){restoreCandidate=null;{node.textContent=hError(err);if(err.code==='conflict')node.insertAdjacentHTML('beforeend','<div class="mt20">'+button(tr('Reload saved draft','تحميل المسودة المحفوظة'),'h-reopen','refresh','small')+'</div>');}}}
    });
    document.addEventListener('submit',async event=>{
      const form=event.target.closest('form[data-form]');if(!form||!form.dataset.form.startsWith('h-'))return;event.preventDefault();event.stopImmediatePropagation();const type=form.dataset.form,data=new FormData(form),id=form.dataset.id;if(ui.locked)return;
      try{
        if(ui.role!=='admin')return;
        if(type==='h-profile'){
          const s=byId('students',id);if(!s||!canInspect(id))return;const name=String(data.get('nameEn')).trim(),email=String(data.get('email')).trim().toLowerCase(),weeks=Number(data.get('reviewIntervalWeeks'));if(name.length<2||!/^\S+@\S+\.\S+$/.test(email)||!Number.isInteger(weeks)||weeks<1||weeks>52)throw new Error(tr('Check the name, email and review interval.','راجع الاسم والبريد وفترة المراجعة.'));
          if([...db.students,...db.doctors,...db.administrators].some(p=>p.id!==id&&p.email.toLowerCase()===email))throw new Error(tr('This email is already assigned.','هذا البريد مستخدم.'));
          Object.assign(s,{name:{en:name,ar:String(data.get('nameAr')).trim()||name},email,reviewIntervalWeeks:weeks,recordVersion:(s.recordVersion||1)+1,initials:initials(name)});save();closeModal();render();toast(tr('Resident updated.','تم تحديث المقيم.'));
        }
        if(type==='h-transition'){H.transition(db,id,{programId:String(data.get('programId')),doctorId:String(data.get('doctorId')),year:Number(data.get('year')),startDate:String(data.get('startDate'))},hActor());save();closeModal();render();hTimeline(id);}
        if(type==='h-admin'){
          if(persona().scopeType!=='hospital')return;const email=String(data.get('email')).trim().toLowerCase(),name=String(data.get('nameEn')).trim();if([...db.students,...db.doctors,...db.administrators].some(p=>p.email.toLowerCase()===email))throw new Error(tr('This email is already assigned.','هذا البريد مستخدم.'));const [scopeType,scopeId]=String(data.get('scope')).split(':');const admin={id:uid('admin'),name:{en:name,ar:String(data.get('nameAr')).trim()||name},email,active:true,scopeType,scopeId,backup:data.has('backup'),initials:initials(name),color:'#526e8b'};db.administrators.push(admin);H.record(db,hActor(),'admin.created',admin.id,now());save();closeModal();render();toast(tr('Demo administrator added.','أُضيف المسؤول التجريبي.'));
        }
        if(type==='h-department'||type==='h-program'){
          if(persona().scopeType!=='hospital')return;const name={en:String(data.get('nameEn')).trim(),ar:String(data.get('nameAr')).trim()};if(name.en.length<2||name.ar.length<2)throw new Error(tr('Enter both names.','أدخل الاسمين.'));if(type==='h-department')db.departments.push({id:uid('dep'),hospitalId:'h1',name});else {const model=db.programs[0];const p={id:uid('program'),departmentId:id,name,color:'#528591',description:{en:'',ar:''},questions:H.copy(model.questions),templateVersion:1};p.templateVersionId='template-'+p.id+'-1';db.programs.push(p);}save();closeModal();render();
        }
        if(type==='h-hospital'){if(persona().scopeType!=='hospital')return;db.hospital.name={en:String(data.get('nameEn')).trim(),ar:String(data.get('nameAr')).trim()};db.hospital.support={en:String(data.get('supportEn')).trim(),ar:String(data.get('supportAr')).trim()};save();closeModal();render();}
        if(type==='h-import-preview'){
          const programId=String(data.get('programId')),doctorId=String(data.get('doctorId')),year=Number(data.get('year')),text=String(data.get('text'));if(!db.doctors.some(d=>d.id===doctorId&&d.active&&d.programs.includes(programId)))throw new Error(tr('Choose an active supervisor for this program.','اختر مشرفاً نشطاً لهذا البرنامج.'));const rows=H.previewImport(db,text,programId,doctorId,year,hActor());if(!rows.length)throw new Error(tr('Add at least one resident.','أضف مقيماً واحداً على الأقل.'));pendingImport={text,programId,doctorId,year};hImportPreview(rows);
        }
        if(type==='h-guides'){
          const p=byId('programs',id);if(!H.programAllowed(db,hActor(),p.id))return;const guide={};p.questions.forEach((q,i)=>guide[q.id]={en:String(data.get('en-'+i)||'').trim(),ar:String(data.get('ar-'+i)||'').trim()});p.templateVersion++;p.templateVersionId='template-'+p.id+'-'+p.templateVersion;db.rubricGuides[p.templateVersionId]=guide;save();closeModal();ui.questionDraft=null;render();toast(tr('New guidance version saved.','حُفظت نسخة إرشادات جديدة.'));
        }
      }catch(err){error(form,hError(err));}
    },true);
    window.addEventListener('storage',event=>{if(event.key!==STORE||!event.newValue)return;try{const incoming=JSON.parse(event.newValue);if((incoming.stateVersion||0)>savedVersion){ui.hConflict=true;ui.hSaveState='failed';clearTimeout(autoTimer);hSaveIndicator();}}catch(_){}});
    window.addEventListener('pagehide',hFlushBeforeLeave);
    window.addEventListener('afterprint',()=>document.body.classList.remove('h-printing'));
    // Seed one controlled write so reloads preserve the migrated model and browser version.
    if(!localStorage.getItem(STORE))save();
  }

  if(LIVE){
    window.addEventListener('hashchange',async()=>{
      if(!captureAuthFragment())return;
      // Same-page links follow the same explicit confirmation flow as a fresh visit.
      resetLiveSession();auth.invitation=null;auth.error='';auth.developmentUrl=null;auth.state='loading';
      await bootLive();
    });
    bootLive();
  }else{
    render();
    const token=new URLSearchParams(location.search).get('invite');
    if(token){const invite=db.invitations.find(i=>i.token===token);if(invite)previewInvite(invite.id);else modal(tr('Demo invitation unavailable','الدعوة التجريبية غير متاحة'),tr('This browser does not have the matching demonstration invitation.','لا توجد الدعوة التجريبية المطابقة في هذا المتصفح.'),`<div class="info-box">${icon('info',16)}<span>${tr('Invitations in this demonstration belong to this browser. Preview the flow from Administrator → Access & invitations.','الدعوات في هذا العرض تخص هذا المتصفح. عاين الخطوات من المسؤول ← الصلاحيات والدعوات.')}</span></div>`,button(tr('Explore the demo','اكتشف العرض'),'close','arrow','primary'));}
  }
})();

</script>
</body>
</html>
